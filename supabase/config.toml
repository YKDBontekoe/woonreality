project_id = "rpldytzigzhzkivajepe"

[api]
enabled = true

[db]
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3017/auth/callback"]

[auth.email]
enable_confirmations = true

# Local stack only. Hosted Auth must enable passkeys separately with
# rp_id = "woonreality.vercel.app" — see docs/auth-setup.md and
# `npm run db:enable-passkeys`.
[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "WoonReality"
rp_id = "localhost"
rp_origins = ["http://localhost:3000", "http://localhost:3017"]

[storage]
enabled = true
